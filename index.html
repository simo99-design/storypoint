<!DOCTYPE html>
<html lang="it" data-palette="mono">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Workspace — The Wave</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-header="light" data-bigsp="on">

<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="14" width="4" height="5" rx="0"/><rect x="15" y="8" width="4" height="11" rx="0"/></svg>
        </div>
        <div class="auth-eyebrow">Design · Code · Surf</div>
        <h2 class="auth-title" id="auth-title-text">Accedi al Workspace</h2>
        <p class="auth-sub" id="auth-sub-text">Inserisci i tuoi dati per continuare.</p>

        <div id="auth-msg" class="auth-msg"></div>

        <form id="auth-form" class="auth-form">
            <div id="field-name" class="hidden">
                <label>Nome</label>
                <input type="text" id="auth-name" class="fi" placeholder="Mario Rossi" autocomplete="name">
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="auth-email" class="fi" required placeholder="mario@example.com" autocomplete="email">
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="auth-password" class="fi" required placeholder="••••••••" autocomplete="current-password" minlength="6">
            </div>
            <div id="field-password2" class="hidden">
                <label>Conferma Password</label>
                <input type="password" id="auth-password2" class="fi" placeholder="••••••••" autocomplete="new-password" minlength="6">
            </div>
            <button type="button" id="auth-forgot-btn" class="auth-link">Password dimenticata?</button>
            <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="margin-top:.4rem; width:100%; padding:.8rem;">Accedi</button>
        </form>
        <button id="auth-toggle-btn" class="auth-toggle">Non hai un account? Registrati</button>
    </div>
</div>

<header id="hdr" class="hidden"></header>
<main   id="mnt" class="hidden"></main>
<div id="overlay-sprint" class="overlay hidden"></div>

<script src="app.js"></script>
</body>
</html>
