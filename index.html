<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Time Tracker & Workspace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
            flex-wrap: wrap;
        }

        .brand { display: flex; align-items: center; gap: .75rem; }
        .brand-icon {
            background: #2563eb; color: white;
            padding: .5rem; border-radius: .5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-title  { font-size: 1.25rem; font-weight: 700; color: #1e293b; }
        .brand-sub    { font-size: .75rem; color: #64748b; }

        .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

        select.sprint-select {
            background: #f1f5f9; border: 1px solid #e2e8f0;
            color: #1e293b; font-size: .875rem; font-weight: 500;
            border-radius: .5rem; padding: .625rem .75rem;
            outline: none; cursor: pointer; font-family: inherit;
        }

        .btn {
            display: inline-flex; align-items: center; gap: .4rem;
            padding: .5rem 1rem; border-radius: .5rem;
            font-size: .875rem; font-weight: 500;
            cursor: pointer; border: none; font-family: inherit;
            transition: background .15s;
        }
        .btn-dark    { background: #1e293b; color: white; }
        .btn-dark:hover  { background: #334155; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-ghost   { background: transparent; color: #475569; }
        .btn-ghost:hover { background: #f1f5f9; }

        /* ── Main ── */
        main { padding: 1.5rem; max-width: 90rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

        /* ── Card ── */
        .card {
            background: white; border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
            padding: 1.5rem;
        }

        /* ── Sprint header ── */
        .sprint-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
        .sprint-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: .5rem; }
        .sprint-meta  { display: flex; gap: 1rem; font-size: .875rem; color: #475569; flex-wrap: wrap; }
        .sprint-meta span { display: flex; align-items: center; gap: .375rem; }

        /* ── Stats grid ── */
        .stat-card { border-radius: .75rem; padding: 1.25rem; border: 1px solid; }
        .stat-card.indigo { background: #eef2ff; border-color: #c7d2fe; display: flex; flex-direction: column; }
        .sc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
        .sc-title { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: .5rem; color: #312e81; }

        /* project list in indigo card */
        .proj-list { 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            gap: 1rem; 
            margin-top: 0.5rem;
        }

        .proj-item { 
            background: white; 
            border: 1px solid #c7d2fe; 
            border-radius: .5rem; 
            padding: 1rem; 
            position: relative; 
            overflow: hidden; 
            flex: 1; 
            min-width: 250px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .proj-name { font-weight: 700; font-size: 1rem; color: #334155; }
        .proj-hours { background: #eff6ff; color: #1d4ed8; padding: .25rem .75rem; border-radius: 9999px; font-size: .875rem; font-weight: 600; border: 1px solid #bfdbfe; }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .tab-btn {
            padding-bottom: .75rem; font-size: .875rem; font-weight: 600;
            border: none; background: none; cursor: pointer; color: #64748b;
            position: relative; transition: color .15s; font-family: inherit;
        }
        .tab-btn:hover { color: #1e293b; }
        .tab-btn.active { color: #2563eb; }
        .tab-btn.active::after { content:''; position: absolute; bottom: -1px; left:0; right:0; height: 2px; background: #2563eb; }

        /* ── Calendar ── */
        .sec-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .75rem; }
        .sec-title { font-size: 1.25rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: .5rem; }
        .week-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
        .week-btn {
            padding: .375rem .75rem; border-radius: .5rem; font-size: .875rem;
            font-weight: 500; border: none; cursor: pointer;
            background: #f1f5f9; color: #475569; font-family: inherit; transition: background .15s;
        }
        .week-btn:hover  { background: #e2e8f0; }
        .week-btn.active { background: #dbeafe; color: #1d4ed8; }

        .table-wrap { overflow-x: auto; padding-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: .875rem; }
        th, td { border: 1px solid #e2e8f0; padding: .75rem; }
        th { background: #f8fafc; font-weight: 600; color: #475569; text-align: center; }
        th:first-child { text-align: left; width: 8rem; }
        th.sat { background: #fff1f2; color: #e11d48; }
        td:first-child { background: #f8fafc; font-weight: 500; color: #475569; white-space: nowrap; }
        td.sat { background: rgba(255,241,242,.3); }

        .cell-wrap { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: center; transition: background .15s; cursor: pointer; }
        .cell-wrap:hover { background: rgba(59,130,246,.05); }
        .cell-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .cell-tag {
            padding: .25rem .625rem; background: white; border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,.05); border-radius: .375rem;
            font-weight: 700; font-size: .75rem; color: #334155; pointer-events: none;
        }

        .proj-badges { margin-top: 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .pb-label  { font-size: .875rem; font-weight: 600; color: #475569; }
        .pb-badge  { padding: .25rem .75rem; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 9999px; font-size: .875rem; font-weight: 500; }

        /* ── Workspace Notion-style con Toolbar Icone ── */
        .workspace-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 1.5rem; 
            align-items: start; 
        }
        .workspace-group { 
            background: white; border: 1px solid #e2e8f0; 
            border-radius: .75rem; padding: 1.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: box-shadow .2s;
            display: flex;
            flex-direction: column;
        }
        .workspace-group:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        
        .wg-title { 
            font-size: 1.125rem; font-weight: 700; color: #1e293b; 
            margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; 
        }

        /* Toolbar di Formattazione */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.25rem;
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
            border-bottom: 2px solid #f1f5f9;
        }
        
        .toolbar-divider {
            width: 1px;
            height: 18px;
            background: #cbd5e1;
            margin: 0 0.25rem;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            padding: 0.35rem;
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .toolbar-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        /* Editor Notion-style */
        .notion-editor {
            min-height: 200px;
            outline: none;
            color: #334155;
            font-size: .9375rem;
            line-height: 1.6;
        }
        
        .notion-editor[contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }

        /* Stili Markdown */
        .notion-editor h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 1.25em 0 0.5em; }
        .notion-editor h2 { font-size: 1.25rem; font-weight: 600; color: #1e293b; margin: 1em 0 0.5em; }
        .notion-editor h3 { font-size: 1.125rem; font-weight: 600; color: #334155; margin: 0.75em 0 0.5em; }
        .notion-editor hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
        .notion-editor ul { padding-left: 1.5rem; margin: 0.5rem 0; }
        .notion-editor li { margin-bottom: 0.25rem; }
        .notion-editor p  { margin-bottom: 0.5rem; min-height: 1.5em; }
        
        /* Stile Checkbox Custom */
        .notion-checkbox {
            accent-color: #2563eb;
            width: 1.125rem;
            height: 1.125rem;
            margin-right: 0.5rem;
            transform: translateY(3px);
            cursor: pointer;
        }

        /* ── Empty state ── */
        .empty { text-align: center; padding: 3rem 1rem; background: white; border-radius: .75rem; border: 2px dashed #cbd5e1; color: #64748b; }

        /* ── Modal ── */
        .overlay {
            position: fixed; inset: 0; background: rgba(15,23,42,.5);
            backdrop-filter: blur(4px); display: flex; align-items: center;
            justify-content: center; padding: 1rem; z-index: 50;
        }
        .modal { background: white; border-radius: 1rem; width: 100%; max-width: 28rem; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
        .modal-hdr { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #f1f5f9; }
        .modal-title { font-weight: 700; font-size: 1.125rem; color: #1e293b; }
        .modal-close { background: none; border: none; cursor: pointer; color: #94a3b8; padding: .25rem; border-radius: .25rem; transition: color .15s; }
        .modal-close:hover { color: #475569; }
        .modal-body { padding: 1rem; }

        .fg { margin-bottom: 1rem; }
        label { display: block; font-size: .875rem; font-weight: 500; color: #374151; margin-bottom: .25rem; }
        .fi {
            width: 100%; border: 1px solid #d1d5db; border-radius: .5rem;
            padding: .5rem .75rem; font-size: .875rem; outline: none;
            transition: border-color .2s, box-shadow .2s; font-family: inherit;
        }
        .fi:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
        .fhint { font-size: .75rem; color: #64748b; margin-top: .25rem; }
        .frow  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .ffooter { display: flex; justify-content: flex-end; gap: .5rem; padding-top: 1rem; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header id="hdr"></header>
<main   id="mnt"></main>

<div id="overlay-sprint" class="overlay hidden"></div>

<script>
// ── SVG Icons ───────────────────────────────────────────────────────────────
const IC = {
    chart:     `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="14" width="4" height="5" rx="1"/><rect x="15" y="8" width="4" height="11" rx="1"/></svg>`,
    calendar:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    brief16:   `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
    brief18:   `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
    plus:      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    x:         `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    save:      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
    folder:    `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`,
    pen:       `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`,
    clock:     `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    
    // Toolbar Icons
    heading1:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="m17 12 3-2v8"/></svg>`,
    heading2:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></svg>`,
    heading3:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M17.5 10.5c1.7-1 3.5 0 3.5 1.5a2 2 0 0 1-2 2"/><path d="M17 17.5c2 1.5 4 .3 4-1.5a2 2 0 0 0-2-2c-1.2-.5-2.5 0-3 1"/></svg>`,
    paragraph: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v16"/><path d="M17 4v16"/><path d="M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/></svg>`,
    list:      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
    checkList: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>`,
    separator: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>`
};

// ── State ────────────────────────────────────────────────────────────────────
let S = {
    sprints: [
        { id:'s1', name:'Sprint Giugno (Esempio)', startDate:'2026-06-15', endDate:'2026-06-26', projects:['RCA','MEM','TW'] }
    ],
    activeSprintId: 's1',
    projectDocs: {
        'RCA': '<h1>Sviluppo Homepage e UI</h1><br><input type="checkbox" class="notion-checkbox" checked="checked"> Setup iniziale repository<br><input type="checkbox" class="notion-checkbox"> Definizione Design System<br><hr><p>Ricordarsi di allinearsi con il team marketing per le immagini hero.</p>',
        'MEM': '<h2>Integrazione API</h2><ul><li>Creazione endpoint Login</li><li>Test sicurezza JWT</li></ul>',
    },
    gridLogs: {
        's1': {
            '2026-06-15_0':'RCA','2026-06-15_1':'RCA','2026-06-15_2':'RCA','2026-06-15_3':'RCA',
            '2026-06-15_4':'RCA','2026-06-15_5':'RCA','2026-06-15_6':'MEM','2026-06-15_7':'MEM',
            '2026-06-16_0':'MEM','2026-06-16_1':'MEM','2026-06-16_2':'RCA'
        }
    },
    activeTab: 'kanban', 
    activeWeekIndex: 0,
};

// ── Helpers ──────────────────────────────────────────────────────────────────
function sprint() { return S.sprints.find(s => s.id === S.activeSprintId); }
function todayStr() { return localDate(new Date()); }

function localDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function noon(str) { return new Date(str + 'T12:00:00'); }

function getWorkingDays(start, end) {
    let n = 0, cur = noon(start), e = noon(end);
    while (cur <= e) { const d = cur.getDay(); if (d && d !== 6) n++; cur.setDate(cur.getDate()+1); }
    return n;
}

function fmtDate(str) {
    return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',year:'numeric'}).format(noon(str));
}

const HOURS = [
    "1° 09:00-10:00","2° 10:00-11:00","3° 11:00-12:00","4° 12:00-13:00",
    "5° 14:00-15:00","6° 15:00-16:00","7° 16:00-17:00","8° 17:00-18:00"
];

const DAY_NAMES = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];

function getWeeks(startDate, endDate) {
    const s = noon(startDate), e = noon(endDate);
    const weeks = [];
    const dow = s.getDay() || 7;
    let mon = new Date(s); mon.setDate(s.getDate() - (dow-1));
    let wk = 1;
    while (mon <= e) {
        const days = [];
        for (let i = 0; i < 6; i++) {
            const d = new Date(mon); d.setDate(mon.getDate()+i);
            days.push({ str: localDate(d), name: DAY_NAMES[d.getDay()] });
        }
        weeks.push({ label:`Settimana ${wk}`, days });
        mon.setDate(mon.getDate()+7); wk++;
    }
    return weeks;
}

// ── Render helpers ───────────────────────────────────────────────────────────
function h(el, html) { el.innerHTML = html; }

// ── Main render ──────────────────────────────────────────────────────────────
function render() {
    renderHeader();
    renderMain();
}

function renderHeader() {
    const td = todayStr();
    const active = S.sprints.filter(s => s.endDate >= td);
    const past   = S.sprints.filter(s => s.endDate <  td);

    let opts = '';
    if (active.length) opts += `<optgroup label="Sprint Attivi">${active.map(s => `<option value="${s.id}" ${s.id===S.activeSprintId?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
    if (past.length)   opts += `<optgroup label="Sprint Passati">${past.map(s => `<option value="${s.id}" ${s.id===S.activeSprintId?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
    if (!S.sprints.length) opts = '<option value="">Nessun sprint</option>';

    h(document.getElementById('hdr'), `
        <div class="brand">
            <div class="brand-icon">${IC.chart}</div>
            <div>
                <div class="brand-title">Agile Workspace</div>
                <div class="brand-sub">Gestione Ore &amp; Documentazione Notion-style</div>
            </div>
        </div>
        <div class="header-right">
            <select class="sprint-select" id="sel-sprint">${opts}</select>
            <button class="btn btn-dark" id="btn-new-sprint">${IC.plus} Nuovo Sprint</button>
        </div>
    `);

    document.getElementById('sel-sprint').addEventListener('change', e => {
        S.activeSprintId = e.target.value;
        S.activeWeekIndex = 0;
        render();
    });
    document.getElementById('btn-new-sprint').addEventListener('click', openSprintModal);
}

function renderMain() {
    const sp = sprint();
    const mnt = document.getElementById('mnt');
    if (!sp) { h(mnt, `<div class="empty"><p>Nessuno sprint selezionato. Creane uno nuovo!</p></div>`); return; }

    const wdays = getWorkingDays(sp.startDate, sp.endDate);
    const gl = S.gridLogs[S.activeSprintId] || {};

    const allProj = [...new Set([...(sp.projects||[])])];
    
    const projStats = allProj.map(proj => {
        const cH  = Object.values(gl).filter(v => v===proj).length;
        return { proj, cH };
    });

    const weeks = getWeeks(sp.startDate, sp.endDate);

    h(mnt, `
        <div class="card">
            <div class="sprint-hdr">
                <div>
                    <div class="sprint-title">${esc(sp.name)}</div>
                    <div class="sprint-meta">
                        <span>${IC.calendar} ${fmtDate(sp.startDate)} – ${fmtDate(sp.endDate)}</span>
                        <span>${IC.brief16} ${wdays} giorni lavorativi</span>
                    </div>
                </div>
            </div>

            <div class="stat-card indigo">
                <div class="sc-head" style="margin-bottom:1rem;flex-shrink:0">
                    <div class="sc-title">${IC.brief18} Riepilogo Ore Lavorate per Progetto</div>
                </div>
                <div class="proj-list">
                    ${projStats.length ? projStats.map(p => `
                        <div class="proj-item">
                            <div class="proj-name">${esc(p.proj)}</div>
                            <div class="proj-hours">${IC.clock} ${p.cH}h Segnate</div>
                        </div>
                    `).join('') : '<p style="font-size:.875rem;color:#64748b;font-style:italic">Nessun progetto assegnato a questo sprint</p>'}
                </div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn${S.activeTab==='kanban'?' active':''}"   data-tab="kanban">Workspace Progetti</button>
                <button class="tab-btn${S.activeTab==='calendar'?' active':''}" data-tab="calendar">Calendario Ore</button>
            </div>

            <div id="tab-kan"  class="${S.activeTab!=='kanban'?'hidden':''}">
                ${renderWorkspace(sp, allProj)}
            </div>
            
            <div id="tab-cal"  class="${S.activeTab!=='calendar'?'hidden':''}">
                ${renderCalendarInner(sp, weeks, gl, allProj)}
            </div>
        </div>
    `);

    // Inizializza gli Event Listeners
    mnt.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
        S.activeTab = b.dataset.tab; render();
    }));

    mnt.querySelectorAll('.week-btn').forEach(b => b.addEventListener('click', () => {
        S.activeWeekIndex = +b.dataset.w; render();
    }));

    mnt.querySelectorAll('.cell-select').forEach(sel => sel.addEventListener('change', e => {
        const {d, h: hIdx} = sel.dataset;
        const key = `${d}_${hIdx}`;
        if (!S.gridLogs[S.activeSprintId]) S.gridLogs[S.activeSprintId] = {};
        if (e.target.value === '') delete S.gridLogs[S.activeSprintId][key];
        else S.gridLogs[S.activeSprintId][key] = e.target.value;
        render();
    }));

    // Inizializza gli editor Markdown e Toolbar
    setupNotionEditors();
}

// ── Motore Editor Markdown e Toolbar ──────────────────────────────────────────
function setupNotionEditors() {
    
    // Configura la Toolbar
    document.querySelectorAll('.toolbar-btn').forEach(btn => {
        // Previene la perdita del focus dell'editor quando si clicca il pulsante
        btn.addEventListener('mousedown', e => e.preventDefault());
        
        btn.addEventListener('click', e => {
            const cmd = btn.dataset.cmd;
            const val = btn.dataset.val || null;
            document.execCommand(cmd, false, val);
            
            // Trova l'editor associato a questa toolbar e salva lo stato
            const editor = btn.closest('.workspace-group').querySelector('.notion-editor');
            if (editor) {
                S.projectDocs[editor.dataset.proj] = editor.innerHTML;
            }
        });
    });

    // Configura gli Editor
    document.querySelectorAll('.notion-editor').forEach(ed => {
        
        // Salva i dati ad ogni modifica
        ed.addEventListener('input', () => {
            S.projectDocs[ed.dataset.proj] = ed.innerHTML;
        });
        
        // Listener per le checkbox fisiche
        ed.addEventListener('change', e => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
                if (e.target.checked) e.target.setAttribute('checked', 'checked');
                else e.target.removeAttribute('checked');
                S.projectDocs[ed.dataset.proj] = ed.innerHTML;
            }
        });

        // Intercetta Spazio per triggerare i comandi Markdown (opzionale)
        ed.addEventListener('keyup', e => {
            if (e.key === ' ') {
                const sel = window.getSelection();
                if (!sel.isCollapsed) return;
                
                const node = sel.anchorNode;
                if (node && node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent;
                    
                    if (text === '# ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H1'); } 
                    else if (text === '## ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H2'); } 
                    else if (text === '### ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H3'); } 
                    else if (text === '- ' || text === '* ') { node.textContent = ''; document.execCommand('insertUnorderedList', false, null); } 
                    else if (text === '--- ') { node.textContent = ''; document.execCommand('insertHorizontalRule', false, null); } 
                    else if (text === '[] ' || text === '[ ] ') {
                        node.textContent = '';
                        document.execCommand('insertHTML', false, '<input type="checkbox" class="notion-checkbox">&nbsp;');
                    }
                }
            }
        });
    });
}

function renderWorkspace(sp, allProj) {
    if (!allProj.length) return `<div class="empty"><p>Non ci sono progetti assegnati a questo sprint.</p></div>`;

    const hintBar = `
        <div class="sec-hdr">
            <h2 class="sec-title">${IC.pen} Documentazione & Attività</h2>
        </div>`;

    const listHtml = allProj.map(proj => {
        const content = S.projectDocs[proj] || '';
        return `
            <div class="workspace-group">
                <h3 class="wg-title">${IC.folder} ${esc(proj)}</h3>
                
                <div class="editor-toolbar">
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H1" title="Titolo Grande (H1)">${IC.heading1}</button>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H2" title="Titolo Medio (H2)">${IC.heading2}</button>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H3" title="Titolo Piccolo (H3)">${IC.heading3}</button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="P" title="Testo normale">${IC.paragraph}</button>
                    <button class="toolbar-btn" data-cmd="insertUnorderedList" title="Elenco puntato">${IC.list}</button>
                    <button class="toolbar-btn" data-cmd="insertHTML" data-val="<input type='checkbox' class='notion-checkbox'>&nbsp;" title="Checkbox interattiva">${IC.checkList}</button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn" data-cmd="insertHorizontalRule" title="Linea di divisione">${IC.separator}</button>
                </div>

                <div class="notion-editor" contenteditable="true" data-proj="${esc(proj)}" data-placeholder="Inizia a scrivere qui per il progetto ${esc(proj)}...">
                    ${content}
                </div>
            </div>
        `;
    }).join('');

    return hintBar + `<div class="workspace-grid">${listHtml}</div>`;
}

function renderCalendarInner(sp, weeks, gl, allProj) {
    const wk = weeks[S.activeWeekIndex];
    if (!wk) return '<div class="empty"><p>Nessuna settimana disponibile.</p></div>';

    const rows = HOURS.map((lbl, hi) => {
        const cells = wk.days.map(day => {
            const val = gl[`${day.str}_${hi}`] || '';
            const sat = day.name === 'Sabato';
            return `<td class="${sat?'sat':''}">
                <div class="cell-wrap">
                    <select class="cell-select" data-d="${day.str}" data-h="${hi}">
                        <option value=""></option>
                        ${allProj.map(p => `<option value="${esc(p)}"${val===p?' selected':''}>${esc(p)}</option>`).join('')}
                    </select>
                    ${val ? `<div class="cell-tag">${esc(val)}</div>` : ''}
                </div>
            </td>`;
        }).join('');
        return `<tr><td>${lbl}</td>${cells}</tr>`;
    }).join('');

    return `
        <div class="sec-hdr">
            <h2 class="sec-title">Timesheet Progetti</h2>
            <div class="week-btns">
                ${weeks.map((w,i) => `<button class="week-btn${i===S.activeWeekIndex?' active':''}" data-w="${i}">${w.label}</button>`).join('')}
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>Ore</th>
                    ${wk.days.map(d => `<th class="${d.name==='Sabato'?'sat':''}">${d.name}<br><span style="font-size:.75rem;font-weight:400;opacity:.7">${fmtDate(d.str)}</span></th>`).join('')}
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div class="proj-badges">
            <span class="pb-label">Progetti Assegnati in questo Sprint:</span>
            ${allProj.length
                ? allProj.map(p => `<span class="pb-badge">${esc(p)}</span>`).join('')
                : '<span style="font-size:.875rem;color:#94a3b8;font-style:italic">Nessun progetto assegnato.</span>'}
        </div>
    `;
}

// ── Modals ───────────────────────────────────────────────────────────────────
function mkModal(id, title, bodyHtml) {
    const el = document.getElementById(id);
    h(el, `
        <div class="modal">
            <div class="modal-hdr">
                <span class="modal-title">${title}</span>
                <button class="modal-close" data-close="${id}">${IC.x}</button>
            </div>
            <div class="modal-body">${bodyHtml}</div>
        </div>
    `);
    el.classList.remove('hidden');
    
    el.querySelector('[data-close]').onclick = () => el.classList.add('hidden');
    el.onclick = e => { if (e.target === el) el.classList.add('hidden'); };
    
    return el;
}

function openSprintModal() {
    const el = mkModal('overlay-sprint', 'Crea Nuovo Sprint', `
        <form id="form-sprint">
            <div class="fg">
                <label>Nome Sprint</label>
                <input type="text" name="name" class="fi" required placeholder="es. Sprint Luglio">
            </div>
            <div class="frow fg">
                <div><label>Data Inizio</label><input type="date" name="startDate" class="fi" required></div>
                <div><label>Data Fine</label><input type="date" name="endDate" class="fi" required></div>
            </div>
            <div class="fg">
                <label>Progetti Assegnati</label>
                <input type="text" name="projects" class="fi" placeholder="es. RCA, MEM, TW">
                <p class="fhint">Sigle separate da virgola.</p>
            </div>
            <div class="ffooter">
                <button type="button" class="btn btn-ghost" data-close="overlay-sprint">Annulla</button>
                <button type="submit" class="btn btn-primary">${IC.save} Salva Sprint</button>
            </div>
        </form>
    `);
    el.querySelector('#form-sprint').onsubmit = e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newSprint = {
            id: `s-${Date.now()}`,
            name: fd.get('name'),
            startDate: fd.get('startDate'),
            endDate: fd.get('endDate'),
            projects: (fd.get('projects')||'').split(',').map(p=>p.trim()).filter(Boolean)
        };
        S.sprints.push(newSprint);
        S.activeSprintId = newSprint.id;
        S.activeWeekIndex = 0;
        el.classList.add('hidden');
        render();
    };
}

// ── Safety ───────────────────────────────────────────────────────────────────
function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ─────────────────────────────────────────────────────────────────────
render();
</script>
