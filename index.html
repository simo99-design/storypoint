<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Time Tracker & Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }

        /* ── Auth Screen ── */
        #auth-screen {
            position: fixed; inset: 0; background: #f8fafc; z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .auth-card {
            background: white; width: 100%; max-width: 24rem; border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); padding: 2rem;
            border: 1px solid #e2e8f0; text-align: center;
        }
        .auth-logo {
            background: #2563eb; color: white; display: inline-flex;
            padding: .75rem; border-radius: .75rem; margin-bottom: 1rem;
        }
        .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; color: #1e293b; }
        .auth-sub { font-size: .875rem; color: #64748b; margin-bottom: 1.5rem; }
        .auth-form { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
        .auth-toggle { font-size: .875rem; color: #2563eb; cursor: pointer; background: none; border: none; margin-top: 1.5rem; text-decoration: underline; font-family: inherit; }
        .auth-link { font-size: .8125rem; color: #2563eb; cursor: pointer; background: none; border: none; padding: 0; text-decoration: underline; font-family: inherit; align-self: flex-end; margin-top: -.5rem; }
        .auth-msg { font-size: .875rem; margin-bottom: 1rem; display: none; padding: .625rem; border-radius: .5rem; text-align: center; line-height: 1.4; }
        .auth-msg.error { color: #ef4444; background: #fef2f2; border: 1px solid #fecaca; }
        .auth-msg.success { color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; }

        /* ── Header ── */
        header {
            background: white; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem;
            position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
            justify-content: space-between; gap: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); flex-wrap: wrap;
        }

        .brand { display: flex; align-items: center; gap: .75rem; }
        .brand-icon {
            background: #2563eb; color: white; padding: .5rem; border-radius: .5rem;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-title  { font-size: 1.25rem; font-weight: 700; color: #1e293b; }
        .brand-sub    { font-size: .75rem; color: #64748b; }

        .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

        select.sprint-select {
            background: #f1f5f9; border: 1px solid #e2e8f0;
            color: #1e293b; font-size: .875rem; font-weight: 500;
            border-radius: .5rem; padding: .625rem .75rem;
            outline: none; cursor: pointer; font-family: inherit;
        }

        .btn {
            display: inline-flex; align-items: center; gap: .4rem; justify-content: center;
            padding: .5rem 1rem; border-radius: .5rem; font-size: .875rem; font-weight: 500;
            cursor: pointer; border: none; font-family: inherit; transition: background .15s;
        }
        .btn-dark    { background: #1e293b; color: white; }
        .btn-dark:hover  { background: #334155; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-ghost   { background: transparent; color: #475569; }
        .btn-ghost:hover { background: #f1f5f9; }
        .btn-logout  { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; }
        .btn-logout:hover { background: #fee2e2; }

        /* ── Main ── */
        main { padding: 1.5rem; max-width: 90rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

        /* ── Card ── */
        .card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.04); padding: 1.5rem; }
        .sprint-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
        .sprint-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: .5rem; }
        .sprint-meta  { display: flex; gap: 1rem; font-size: .875rem; color: #475569; flex-wrap: wrap; }
        .sprint-meta span { display: flex; align-items: center; gap: .375rem; }

        .stat-card { border-radius: .75rem; padding: 1.25rem; border: 1px solid; }
        .stat-card.indigo { background: #eef2ff; border-color: #c7d2fe; display: flex; flex-direction: column; }
        .sc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
        .sc-title { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: .5rem; color: #312e81; }

        .proj-list { display: flex; flex-direction: row; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem; }
        .proj-item { background: white; border: 1px solid #c7d2fe; border-radius: .5rem; padding: 1rem; position: relative; overflow: hidden; flex: 1; min-width: 250px; display: flex; align-items: center; justify-content: space-between; }
        .proj-name { font-weight: 700; font-size: 1rem; color: #334155; }
        .proj-hours { background: #eff6ff; color: #1d4ed8; padding: .25rem .75rem; border-radius: 9999px; font-size: .875rem; font-weight: 600; border: 1px solid #bfdbfe; }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; }
        .tab-btn { padding-bottom: .75rem; font-size: .875rem; font-weight: 600; border: none; background: none; cursor: pointer; color: #64748b; position: relative; transition: color .15s; font-family: inherit; }
        .tab-btn:hover { color: #1e293b; }
        .tab-btn.active { color: #2563eb; }
        .tab-btn.active::after { content:''; position: absolute; bottom: -1px; left:0; right:0; height: 2px; background: #2563eb; }

        /* ── Calendar ── */
        .sec-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .75rem; }
        .sec-title { font-size: 1.25rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: .5rem; }
        .week-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
        .week-btn { padding: .375rem .75rem; border-radius: .5rem; font-size: .875rem; font-weight: 500; border: none; cursor: pointer; background: #f1f5f9; color: #475569; font-family: inherit; transition: background .15s; }
        .week-btn:hover  { background: #e2e8f0; }
        .week-btn.active { background: #dbeafe; color: #1d4ed8; }
        .table-wrap { overflow-x: auto; padding-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: .875rem; }
        th, td { border: 1px solid #e2e8f0; padding: .75rem; }
        th { background: #f8fafc; font-weight: 600; color: #475569; text-align: center; }
        th:first-child { text-align: left; width: 8rem; }
        th.sat { background: #fff1f2; color: #e11d48; }
        td:first-child { background: #f8fafc; font-weight: 500; color: #475569; white-space: nowrap; }
        td.sat { background: rgba(255,241,242,.3); }
        .cell-wrap { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: center; transition: background .15s; cursor: pointer; }
        .cell-wrap:hover { background: rgba(59,130,246,.05); }
        .cell-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .cell-tag { padding: .25rem .625rem; background: white; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,.05); border-radius: .375rem; font-weight: 700; font-size: .75rem; color: #334155; pointer-events: none; }
        .proj-badges { margin-top: 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .pb-label  { font-size: .875rem; font-weight: 600; color: #475569; }
        .pb-badge  { padding: .25rem .75rem; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 9999px; font-size: .875rem; font-weight: 500; }

        /* ── Workspace Notion-style ── */
        .workspace-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; align-items: start; }
        .workspace-group { background: white; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: box-shadow .2s; display: flex; flex-direction: column; }
        .workspace-group:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .wg-title { font-size: 1.125rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
        .editor-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; padding-bottom: 0.75rem; margin-bottom: 0.75rem; border-bottom: 2px solid #f1f5f9; }
        .toolbar-divider { width: 1px; height: 18px; background: #cbd5e1; margin: 0 0.25rem; }
        .toolbar-btn { background: transparent; border: 1px solid transparent; border-radius: 0.375rem; padding: 0.35rem; color: #64748b; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
        .toolbar-btn:hover { background: #f1f5f9; color: #1e293b; }
        .notion-editor { min-height: 200px; outline: none; color: #334155; font-size: .9375rem; line-height: 1.6; }
        .notion-editor[contenteditable]:empty:before { content: attr(data-placeholder); color: #94a3b8; pointer-events: none; display: block; }
        .notion-editor h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 1.25em 0 0.5em; }
        .notion-editor h2 { font-size: 1.25rem; font-weight: 600; color: #1e293b; margin: 1em 0 0.5em; }
        .notion-editor h3 { font-size: 1.125rem; font-weight: 600; color: #334155; margin: 0.75em 0 0.5em; }
        .notion-editor hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }
        .notion-editor ul { padding-left: 1.5rem; margin: 0.5rem 0; }
        .notion-editor li { margin-bottom: 0.25rem; }
        .notion-editor p  { margin-bottom: 0.5rem; min-height: 1.5em; }
        .notion-checkbox { accent-color: #2563eb; width: 1.125rem; height: 1.125rem; margin-right: 0.5rem; transform: translateY(3px); cursor: pointer; }

        /* ── Generiche ── */
        .empty { text-align: center; padding: 3rem 1rem; background: white; border-radius: .75rem; border: 2px dashed #cbd5e1; color: #64748b; }
        .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
        .modal { background: white; border-radius: 1rem; width: 100%; max-width: 28rem; box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
        .modal-hdr { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #f1f5f9; }
        .modal-title { font-weight: 700; font-size: 1.125rem; color: #1e293b; }
        .modal-close { background: none; border: none; cursor: pointer; color: #94a3b8; padding: .25rem; border-radius: .25rem; transition: color .15s; }
        .modal-close:hover { color: #475569; }
        .modal-body { padding: 1rem; }
        .fg { margin-bottom: 1rem; }
        label { display: block; font-size: .875rem; font-weight: 500; color: #374151; margin-bottom: .25rem; }
        .fi { width: 100%; border: 1px solid #d1d5db; border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; outline: none; transition: border-color .2s, box-shadow .2s; font-family: inherit; }
        .fi:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
        .fhint { font-size: .75rem; color: #64748b; margin-top: .25rem; }
        .frow  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .ffooter { display: flex; justify-content: flex-end; gap: .5rem; padding-top: 1rem; }
        .hidden { display: none !important; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="14" width="4" height="5" rx="1"/><rect x="15" y="8" width="4" height="11" rx="1"/></svg>
        </div>
        <h2 class="auth-title" id="auth-title-text">Accedi al Workspace</h2>
        <p class="auth-sub" id="auth-sub-text">Inserisci i tuoi dati per continuare.</p>

        <div id="auth-msg" class="auth-msg"></div>

        <form id="auth-form" class="auth-form">
            <div id="field-name" class="hidden">
                <label>Nome</label>
                <input type="text" id="auth-name" class="fi" placeholder="Mario Rossi" autocomplete="name">
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="auth-email" class="fi" required placeholder="mario@example.com" autocomplete="email">
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="auth-password" class="fi" required placeholder="••••••••" autocomplete="current-password" minlength="6">
            </div>
            <div id="field-password2" class="hidden">
                <label>Conferma Password</label>
                <input type="password" id="auth-password2" class="fi" placeholder="••••••••" autocomplete="new-password" minlength="6">
            </div>
            <button type="button" id="auth-forgot-btn" class="auth-link">Password dimenticata?</button>
            <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="margin-top:.5rem; width:100%; padding: .75rem;">Accedi</button>
        </form>
        <button id="auth-toggle-btn" class="auth-toggle">Non hai un account? Registrati</button>
    </div>
</div>

<header id="hdr" class="hidden"></header>
<main   id="mnt" class="hidden"></main>
<div id="overlay-sprint" class="overlay hidden"></div>

const DEFAULT_STATE = {
    sprints: [],
    activeSprintId: null,
    projectDocs: {},
    gridLogs: {},
    activeTab: 'kanban',
    activeWeekIndex: 0
};

// Stato Reale App
let S = JSON.parse(JSON.stringify(DEFAULT_STATE));

// Sistema di salvataggio ritardato (Debouncing) per non intasare il database a ogni lettera digitata
let syncTimeout = null;
async function syncToSupabase() {
    if (!currentUser || !sb) return;

    // Ripuliamo lo stato da elementi non persistenti (se necessario)
    const stateToSave = JSON.parse(JSON.stringify(S));

    const { error } = await sb.from('user_data').upsert({
        user_id: currentUser.id,
        app_state: stateToSave
    }, { onConflict: 'user_id' }); // Aggiunta protezione onConflict
    
    if (error) console.error("Errore salvataggio:", error);
}

function triggerSync() {
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(syncToSupabase, 1500); // Salva 1.5 secondi dopo l'ultima modifica
}

// ── Auth UI Logic ────────────────────────────────────────────────────────────
let isLoginMode = true;

const authScreen = document.getElementById('auth-screen');
const hdr = document.getElementById('hdr');
const mnt = document.getElementById('mnt');
const authForm = document.getElementById('auth-form');
const authToggleBtn = document.getElementById('auth-toggle-btn');
const authForgotBtn = document.getElementById('auth-forgot-btn');
const authTitle = document.getElementById('auth-title-text');
const authSub = document.getElementById('auth-sub-text');
const authSubmitBtn = document.getElementById('auth-submit-btn');
const authMsg = document.getElementById('auth-msg');
const fieldName = document.getElementById('field-name');
const fieldPassword2 = document.getElementById('field-password2');
const inpName = document.getElementById('auth-name');
const inpEmail = document.getElementById('auth-email');
const inpPassword = document.getElementById('auth-password');
const inpPassword2 = document.getElementById('auth-password2');

// Traduce in italiano i messaggi di errore più comuni di Supabase
function translateAuthError(msg) {
    const m = (msg || '').toLowerCase();
    if (m.includes('invalid login credentials')) return "Email o password non corretti.";
    if (m.includes('email not confirmed')) return "Devi confermare l'email prima di accedere. Controlla la tua casella di posta (anche lo spam).";
    if (m.includes('user already registered') || m.includes('already been registered')) return "Esiste già un account con questa email. Prova ad accedere.";
    if (m.includes('password should be at least')) return "La password deve contenere almeno 6 caratteri.";
    if (m.includes('unable to validate email') || m.includes('invalid format')) return "L'indirizzo email non è valido.";
    if (m.includes('rate limit') || m.includes('too many requests')) return "Troppi tentativi. Attendi qualche minuto e riprova.";
    if (m.includes('signups not allowed') || m.includes('signup is disabled')) return "Le registrazioni sono disabilitate nel progetto Supabase.";
    if (m.includes('failed to fetch') || m.includes('networkerror')) return "Impossibile contattare Supabase. Controlla l'URL del progetto e la connessione.";
    return msg || "Si è verificato un errore. Riprova.";
}

function setAuthMode(login) {
    isLoginMode = login;
    authTitle.textContent = login ? "Accedi al Workspace" : "Crea un Account";
    authSub.textContent = login ? "Inserisci i tuoi dati per continuare." : "Inizia a tracciare i tuoi progetti agili.";
    authSubmitBtn.textContent = login ? "Accedi" : "Registrati";
    authToggleBtn.textContent = login ? "Non hai un account? Registrati" : "Hai già un account? Accedi";
    fieldName.classList.toggle('hidden', login);
    fieldPassword2.classList.toggle('hidden', login);
    authForgotBtn.classList.toggle('hidden', !login);
    inpPassword.setAttribute('autocomplete', login ? 'current-password' : 'new-password');
    hideMsg();
}

authToggleBtn.addEventListener('click', () => setAuthMode(!isLoginMode));

authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sb) {
        showMsg("Supabase non è configurato. Inserisci URL e Key nel codice HTML (righe ~236-237).", 'error');
        return;
    }

    const name = inpName.value.trim();
    const email = inpEmail.value.trim();
    const password = inpPassword.value;

    // Validazioni lato client (solo registrazione)
    if (!isLoginMode) {
        if (password.length < 6) {
            showMsg("La password deve contenere almeno 6 caratteri.", 'error');
            return;
        }
        if (password !== inpPassword2.value) {
            showMsg("Le due password non coincidono.", 'error');
            return;
        }
    }

    setLoading(true);
    hideMsg();

    let result;
    if (isLoginMode) {
        result = await sb.auth.signInWithPassword({ email, password });
    } else {
        result = await sb.auth.signUp({
            email,
            password,
            options: { data: { full_name: name } }
        });
    }

    if (result.error) {
        showMsg(translateAuthError(result.error.message), 'error');
        setLoading(false);
        return;
    }

    // Registrazione con conferma email attiva: nessuna session restituita
    if (!isLoginMode && result.data && !result.data.session) {
        showMsg("Registrazione completata! Controlla la tua email per attivare l'account, poi accedi.", 'success');
        setLoading(false);
        setAuthMode(true);
        showMsg("Registrazione completata! Controlla la tua email per attivare l'account, poi accedi.", 'success');
        return;
    }
    // Negli altri casi onAuthStateChange gestirà l'ingresso nell'app
});

authForgotBtn.addEventListener('click', async () => {
    if (!sb) {
        showMsg("Supabase non è configurato.", 'error');
        return;
    }
    const email = inpEmail.value.trim();
    if (!email) {
        showMsg("Inserisci la tua email qui sopra, poi clicca di nuovo su \"Password dimenticata?\".", 'error');
        inpEmail.focus();
        return;
    }
    setLoading(true);
    hideMsg();
    const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href
    });
    setLoading(false);
    if (error) showMsg(translateAuthError(error.message), 'error');
    else showMsg("Ti abbiamo inviato un'email per reimpostare la password.", 'success');
});

function setLoading(on) {
    authSubmitBtn.disabled = on;
    authForgotBtn.disabled = on;
    if (on) {
        authSubmitBtn.innerHTML = `${IC.loader} Attendi...`;
    } else {
        authSubmitBtn.textContent = isLoginMode ? "Accedi" : "Registrati";
    }
}

function showMsg(msg, type) {
    authMsg.textContent = msg;
    authMsg.className = `auth-msg ${type}`;
    authMsg.style.display = 'block';
}

function hideMsg() {
    authMsg.style.display = 'none';
}

async function handleLogout() {
    if (!sb) return;
    await sb.auth.signOut();
}

// Inizializza stato autenticazione
// Mostra a schermo qualsiasi errore non gestito, invece di lasciare la pagina bianca
function showFatal(label, err) {
    console.error(label, err);
    const msg = (err && (err.message || err.reason && err.reason.message)) || String(err);
    hdr.classList.add('hidden');
    mnt.classList.remove('hidden');
    mnt.innerHTML = `<div class="empty"><p><b>${label}</b></p>
        <p style="margin-top:.5rem;font-size:.8125rem;color:#ef4444;word-break:break-word">${esc(msg)}</p>
        <button class="btn btn-primary" style="margin-top:1rem" onclick="window._resetApp()">Resetta sessione e ricarica</button></div>`;
    authScreen.style.display = 'none';
}
window._resetApp = function() {
    try { localStorage.clear(); } catch(e) {}
    if (sb) sb.auth.signOut().finally(() => location.reload());
    else location.reload();
};
window.addEventListener('error', e => showFatal('Errore JavaScript', e.error || e));
window.addEventListener('unhandledrejection', e => showFatal('Errore (promise non gestita)', e.reason || e));

if (sb) {
    sb.auth.onAuthStateChange(async (event, session) => {
        if (session && session.user) {
            currentUser = session.user;
            try {
                // Carica i dati dell'utente dal db
                const { data, error } = await sb.from('user_data').select('app_state').eq('user_id', currentUser.id).maybeSingle();
                if (error) console.error("Errore caricamento dati:", error);

                const saved = (data && data.app_state && typeof data.app_state === 'object') ? data.app_state : {};
                // Uniamo i dati salvati SOPRA allo stato di default: così i campi
                // mancanti (es. sprints, gridLogs) esistono sempre e render() non va in crash.
                S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), saved);
                // Garantiamo i tipi corretti anche se il dato salvato è parziale o corrotto
                if (!Array.isArray(S.sprints))    S.sprints = [];
                if (typeof S.projectDocs !== 'object' || S.projectDocs === null) S.projectDocs = {};
                if (typeof S.gridLogs    !== 'object' || S.gridLogs    === null) S.gridLogs = {};

                // Se non c'era ancora nessuna riga salvata, la creiamo ora
                if (!data || !data.app_state || Object.keys(saved).length === 0) {
                    syncToSupabase();
                }

                authScreen.style.display = 'none';
                hdr.classList.remove('hidden');
                mnt.classList.remove('hidden');
                render();
            } catch (err) {
                showFatal('Errore di avvio', err);
            }
        } else {
            currentUser = null;
            authScreen.style.display = 'flex';
            hdr.classList.add('hidden');
            mnt.classList.add('hidden');
            inpPassword.value = '';
            inpPassword2.value = '';
            setLoading(false);
        }
    });
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function sprint() { return S.sprints.find(s => s.id === S.activeSprintId); }
function todayStr() { return localDate(new Date()); }

function localDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function noon(str) { return new Date(str + 'T12:00:00'); }

function getWorkingDays(start, end) {
    let n = 0, cur = noon(start), e = noon(end);
    while (cur <= e) { const d = cur.getDay(); if (d && d !== 6) n++; cur.setDate(cur.getDate()+1); }
    return n;
}

function fmtDate(str) {
    return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',year:'numeric'}).format(noon(str));
}

const HOURS = [
    "1° 09:00-10:00","2° 10:00-11:00","3° 11:00-12:00","4° 12:00-13:00",
    "5° 14:00-15:00","6° 15:00-16:00","7° 16:00-17:00","8° 17:00-18:00"
];

const DAY_NAMES = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];

function getWeeks(startDate, endDate) {
    const s = noon(startDate), e = noon(endDate);
    const weeks = [];
    const dow = s.getDay() || 7;
    let mon = new Date(s); mon.setDate(s.getDate() - (dow-1));
    let wk = 1;
    while (mon <= e) {
        const days = [];
        for (let i = 0; i < 6; i++) {
            const d = new Date(mon); d.setDate(mon.getDate()+i);
            days.push({ str: localDate(d), name: DAY_NAMES[d.getDay()] });
        }
        weeks.push({ label:`Settimana ${wk}`, days });
        mon.setDate(mon.getDate()+7); wk++;
    }
    return weeks;
}

function h(el, html) { el.innerHTML = html; }

// ── Main render ──────────────────────────────────────────────────────────────
function render() {
    renderHeader();
    renderMain();
}

function renderHeader() {
    const td = todayStr();
    const active = S.sprints.filter(s => s.endDate >= td);
    const past   = S.sprints.filter(s => s.endDate <  td);

    let opts = '';
    if (active.length) opts += `<optgroup label="Sprint Attivi">${active.map(s => `<option value="${s.id}" ${s.id===S.activeSprintId?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
    if (past.length)   opts += `<optgroup label="Sprint Passati">${past.map(s => `<option value="${s.id}" ${s.id===S.activeSprintId?'selected':''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
    if (!S.sprints.length) opts = '<option value="">Nessun sprint</option>';

    h(hdr, `
        <div class="brand">
            <div class="brand-icon">${IC.chart}</div>
            <div>
                <div class="brand-title">Agile Workspace</div>
                <div class="brand-sub">Gestione Ore &amp; Documentazione Notion-style</div>
            </div>
        </div>
        <div class="header-right">
            <select class="sprint-select" id="sel-sprint">${opts}</select>
            <button class="btn btn-dark" id="btn-new-sprint">${IC.plus} Nuovo Sprint</button>
            <button class="btn btn-logout" id="btn-logout" title="Esci dal profilo">${IC.logout}</button>
        </div>
    `);

    document.getElementById('sel-sprint').addEventListener('change', e => {
        S.activeSprintId = e.target.value;
        S.activeWeekIndex = 0;
        triggerSync();
        render();
    });
    document.getElementById('btn-new-sprint').addEventListener('click', openSprintModal);
    document.getElementById('btn-logout').addEventListener('click', handleLogout);
}

function renderMain() {
    const sp = sprint();
    if (!sp) { h(mnt, `<div class="empty"><p>Nessuno sprint selezionato. Creane uno nuovo per iniziare!</p></div>`); return; }

    const wdays = getWorkingDays(sp.startDate, sp.endDate);
    const gl = S.gridLogs[S.activeSprintId] || {};

    const allProj = [...new Set([...(sp.projects||[])])];
    
    const projStats = allProj.map(proj => {
        const cH  = Object.values(gl).filter(v => v===proj).length;
        return { proj, cH };
    });

    const weeks = getWeeks(sp.startDate, sp.endDate);

    h(mnt, `
        <div class="card">
            <div class="sprint-hdr">
                <div>
                    <div class="sprint-title">${esc(sp.name)}</div>
                    <div class="sprint-meta">
                        <span>${IC.calendar} ${fmtDate(sp.startDate)} – ${fmtDate(sp.endDate)}</span>
                        <span>${IC.brief16} ${wdays} giorni lavorativi</span>
                    </div>
                </div>
            </div>

            <div class="stat-card indigo">
                <div class="sc-head" style="margin-bottom:1rem;flex-shrink:0">
                    <div class="sc-title">${IC.brief18} Riepilogo Ore Lavorate per Progetto</div>
                </div>
                <div class="proj-list">
                    ${projStats.length ? projStats.map(p => `
                        <div class="proj-item">
                            <div class="proj-name">${esc(p.proj)}</div>
                            <div class="proj-hours">${IC.clock} ${p.cH}h Segnate</div>
                        </div>
                    `).join('') : '<p style="font-size:.875rem;color:#64748b;font-style:italic">Nessun progetto assegnato a questo sprint</p>'}
                </div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn${S.activeTab==='kanban'?' active':''}"   data-tab="kanban">Workspace Progetti</button>
                <button class="tab-btn${S.activeTab==='calendar'?' active':''}" data-tab="calendar">Calendario Ore</button>
            </div>

            <div id="tab-kan"  class="${S.activeTab!=='kanban'?'hidden':''}">
                ${renderWorkspace(sp, allProj)}
            </div>
            
            <div id="tab-cal"  class="${S.activeTab!=='calendar'?'hidden':''}">
                ${renderCalendarInner(sp, weeks, gl, allProj)}
            </div>
        </div>
    `);

    mnt.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
        S.activeTab = b.dataset.tab; 
        triggerSync();
        render();
    }));

    mnt.querySelectorAll('.week-btn').forEach(b => b.addEventListener('click', () => {
        S.activeWeekIndex = +b.dataset.w; 
        triggerSync();
        render();
    }));

    mnt.querySelectorAll('.cell-select').forEach(sel => sel.addEventListener('change', e => {
        const {d, h: hIdx} = sel.dataset;
        const key = `${d}_${hIdx}`;
        if (!S.gridLogs[S.activeSprintId]) S.gridLogs[S.activeSprintId] = {};
        if (e.target.value === '') delete S.gridLogs[S.activeSprintId][key];
        else S.gridLogs[S.activeSprintId][key] = e.target.value;
        triggerSync();
        render();
    }));

    setupNotionEditors();
}

function setupNotionEditors() {
    document.querySelectorAll('.toolbar-btn').forEach(btn => {
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', e => {
            const cmd = btn.dataset.cmd;
            const val = btn.dataset.val || null;
            document.execCommand(cmd, false, val);
            const editor = btn.closest('.workspace-group').querySelector('.notion-editor');
            if (editor) {
                S.projectDocs[editor.dataset.proj] = editor.innerHTML;
                triggerSync();
            }
        });
    });

    document.querySelectorAll('.notion-editor').forEach(ed => {
        ed.addEventListener('input', () => {
            S.projectDocs[ed.dataset.proj] = ed.innerHTML;
            triggerSync();
        });
        
        ed.addEventListener('change', e => {
            if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
                if (e.target.checked) e.target.setAttribute('checked', 'checked');
                else e.target.removeAttribute('checked');
                S.projectDocs[ed.dataset.proj] = ed.innerHTML;
                triggerSync();
            }
        });

        ed.addEventListener('keyup', e => {
            if (e.key === ' ') {
                const sel = window.getSelection();
                if (!sel.isCollapsed) return;
                
                const node = sel.anchorNode;
                if (node && node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent;
                    
                    if (text === '# ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H1'); } 
                    else if (text === '## ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H2'); } 
                    else if (text === '### ') { node.textContent = ''; document.execCommand('formatBlock', false, 'H3'); } 
                    else if (text === '- ' || text === '* ') { node.textContent = ''; document.execCommand('insertUnorderedList', false, null); } 
                    else if (text === '--- ') { node.textContent = ''; document.execCommand('insertHorizontalRule', false, null); } 
                    else if (text === '[] ' || text === '[ ] ') {
                        node.textContent = '';
                        document.execCommand('insertHTML', false, '<input type="checkbox" class="notion-checkbox">&nbsp;');
                    }
                }
            }
        });
    });
}

function renderWorkspace(sp, allProj) {
    if (!allProj.length) return `<div class="empty"><p>Non ci sono progetti assegnati a questo sprint.</p></div>`;

    const hintBar = `
        <div class="sec-hdr">
            <h2 class="sec-title">${IC.pen} Documentazione & Attività</h2>
        </div>`;

    const listHtml = allProj.map(proj => {
        const content = S.projectDocs[proj] || '';
        return `
            <div class="workspace-group">
                <h3 class="wg-title">${IC.folder} ${esc(proj)}</h3>
                
                <div class="editor-toolbar">
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H1" title="Titolo Grande (H1)">${IC.heading1}</button>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H2" title="Titolo Medio (H2)">${IC.heading2}</button>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="H3" title="Titolo Piccolo (H3)">${IC.heading3}</button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn" data-cmd="formatBlock" data-val="P" title="Testo normale">${IC.paragraph}</button>
                    <button class="toolbar-btn" data-cmd="insertUnorderedList" title="Elenco puntato">${IC.list}</button>
                    <button class="toolbar-btn" data-cmd="insertHTML" data-val="<input type='checkbox' class='notion-checkbox'>&nbsp;" title="Checkbox interattiva">${IC.checkList}</button>
                    <div class="toolbar-divider"></div>
                    <button class="toolbar-btn" data-cmd="insertHorizontalRule" title="Linea di divisione">${IC.separator}</button>
                </div>

                <div class="notion-editor" contenteditable="true" data-proj="${esc(proj)}" data-placeholder="Inizia a scrivere qui per il progetto ${esc(proj)}...">
                    ${content}
                </div>
            </div>
        `;
    }).join('');

    return hintBar + `<div class="workspace-grid">${listHtml}</div>`;
}

function renderCalendarInner(sp, weeks, gl, allProj) {
    const wk = weeks[S.activeWeekIndex];
    if (!wk) return '<div class="empty"><p>Nessuna settimana disponibile.</p></div>';

    const rows = HOURS.map((lbl, hi) => {
        const cells = wk.days.map(day => {
            const val = gl[`${day.str}_${hi}`] || '';
            const sat = day.name === 'Sabato';
            return `<td class="${sat?'sat':''}">
                <div class="cell-wrap">
                    <select class="cell-select" data-d="${day.str}" data-h="${hi}">
                        <option value=""></option>
                        ${allProj.map(p => `<option value="${esc(p)}"${val===p?' selected':''}>${esc(p)}</option>`).join('')}
                    </select>
                    ${val ? `<div class="cell-tag">${esc(val)}</div>` : ''}
                </div>
            </td>`;
        }).join('');
        return `<tr><td>${lbl}</td>${cells}</tr>`;
    }).join('');

    return `
        <div class="sec-hdr">
            <h2 class="sec-title">Timesheet Progetti</h2>
            <div class="week-btns">
                ${weeks.map((w,i) => `<button class="week-btn${i===S.activeWeekIndex?' active':''}" data-w="${i}">${w.label}</button>`).join('')}
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>Ore</th>
                    ${wk.days.map(d => `<th class="${d.name==='Sabato'?'sat':''}">${d.name}<br><span style="font-size:.75rem;font-weight:400;opacity:.7">${fmtDate(d.str)}</span></th>`).join('')}
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div class="proj-badges">
            <span class="pb-label">Progetti Assegnati in questo Sprint:</span>
            ${allProj.length
                ? allProj.map(p => `<span class="pb-badge">${esc(p)}</span>`).join('')
                : '<span style="font-size:.875rem;color:#94a3b8;font-style:italic">Nessun progetto assegnato.</span>'}
        </div>
    `;
}

// ── Modals ───────────────────────────────────────────────────────────────────
function mkModal(id, title, bodyHtml) {
    const el = document.getElementById(id);
    h(el, `
        <div class="modal">
            <div class="modal-hdr">
                <span class="modal-title">${title}</span>
                <button class="modal-close" data-close="${id}">${IC.x}</button>
            </div>
            <div class="modal-body">${bodyHtml}</div>
        </div>
    `);
    el.classList.remove('hidden');
    
    el.querySelector('[data-close]').onclick = () => el.classList.add('hidden');
    el.onclick = e => { if (e.target === el) el.classList.add('hidden'); };
    
    return el;
}

function openSprintModal() {
    const el = mkModal('overlay-sprint', 'Crea Nuovo Sprint', `
        <form id="form-sprint">
            <div class="fg">
                <label>Nome Sprint</label>
                <input type="text" name="name" class="fi" required placeholder="es. Sprint Luglio">
            </div>
            <div class="frow fg">
                <div><label>Data Inizio</label><input type="date" name="startDate" class="fi" required></div>
                <div><label>Data Fine</label><input type="date" name="endDate" class="fi" required></div>
            </div>
            <div class="fg">
                <label>Progetti Assegnati</label>
                <input type="text" name="projects" class="fi" placeholder="es. RCA, MEM, TW">
                <p class="fhint">Sigle separate da virgola.</p>
            </div>
            <div class="ffooter">
                <button type="button" class="btn btn-ghost" data-close="overlay-sprint">Annulla</button>
                <button type="submit" class="btn btn-primary">${IC.save} Salva Sprint</button>
            </div>
        </form>
    `);
    el.querySelector('#form-sprint').onsubmit = e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const newSprint = {
            id: `s-${Date.now()}`,
            name: fd.get('name'),
            startDate: fd.get('startDate'),
            endDate: fd.get('endDate'),
            projects: (fd.get('projects')||'').split(',').map(p=>p.trim()).filter(Boolean)
        };
        S.sprints.push(newSprint);
        S.activeSprintId = newSprint.id;
        S.activeWeekIndex = 0;
        el.classList.add('hidden');
        triggerSync();
        render();
    };
}

function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Se non c'è il client Supabase, eseguiamo un render vuoto per mostrare l'errore o il loader
if(!sb) {
    render();
}
</script>
</body>
